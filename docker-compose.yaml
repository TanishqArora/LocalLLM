services:
  qwen-server:
    build: .
    container_name: qwen-server
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /models/qwen2.5-7b-instruct
      LOAD_4BIT: "1"
    volumes:
      - ./qwen2.5-7b-instruct:/models/qwen2.5-7b-instruct:ro
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
